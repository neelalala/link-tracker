logger = {
    level = INFO
    level = ${?SCRAPPER_LOG_LEVEL}
    file = ${?SCRAPPER_LOGS_FILE}
}

scheduler = {
    fetch-interval = 60 s
    fetch-interval = ${?SCHEDULER_FETCH_INTERVAL}
    fetch-timeout = 60 s
}

bot-service = {
    url = ${BOT_URL}
    protocol = "grpc"
    protocol = ${?BOT_API_PROTOCOL}
}

server = {
    port = ${SCRAPPER_API_PORT}
    protocol = "grpc"
    protocol = ${?SCRAPPER_API_PROTOCOL}
}

database = {
    migrations-dir-url = "file://migrations"
    url = ${DATABASE_URL}
    access-type = BUILDER
    access-type = ${?DATABASE_ACCESS_TYPE}
}

fetchers = {
    preview-limit = 200
    timeout = 10 s
    concurrency = 4 
    concurrency = ${?FETCHERS_COUNT}
    stackoverflow-key = ${STACKOVERFLOW_KEY}
    batch = 500
    batch = ${?FETCHERS_BATCH_SIZE}
}

use-queue = ${?USE_QUEUE}
kafka = {
    brokers = ["kafka-1:9092", "kafka-2:9092", "kafka-3:9092"]
    brokers = ${?KAFKA_BROKERS}
    topic = "link-updates"
    topic = ${?KAFKA_TOPIC}
    workers = {
        count = 1
        count = ${?KAFKA_WORKERS_COUNT}
        interval = 30 s
        interval = ${?KAFKA_WORKERS_INTERVAL}
        event-limit = 50
        event-limit = ${?KAFKA_WORKERS_EVENT_LIMIT}
        max-retries = 5
        max-retries = ${?KAFKA_WORKER_MAX_RETRIES}
    }
    schema-registry-url = "http://schema-registry:8081"
    schema-registry-url = ${?SCHEMA_REGISTRY_URL}
    schema-path = "./docs/link_update.avsc"
    schema-path = ${?SCHEMA_PATH}
}