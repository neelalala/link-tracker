telegram:
  resilience:
    timeout: 10s
    retry:
      enabled: true
      max-retries: 5
      delay: 100ms
      backoff: true
      backoff-factor: 3.0
      max-delay: 15s
    breaker:
      enabled: true
      max-requests: 5
      sliding-window: 1m
      wait-in-open-state: 30s
      minimum-number-of-calls: 5
      failure-rate-threshold: 0.5

logger:
  level: INFO

scrapper-service:
  protocol: grpc
  resilience:
    timeout: 10s
    retry:
      enabled: true
      max-retries: 5
      delay: 100ms
      backoff: true
      backoff-factor: 3.0
      max-delay: 15s
    breaker:
      enabled: true
      max-requests: 5
      sliding-window: 1m
      wait-in-open-state: 30s
      minimum-number-of-calls: 5
      failure-rate-threshold: 0.5

database:
  access-type: SQL

kafka:
  enabled: true
  brokers:
    - "kafka-1:9092"
    - "kafka-2:9092"
    - "kafka-3:9092"
  topic: link-updates.processed
  dlq-topic: link-updates-dlq
  consumer-group: bot-group-1
  retries:
    max-retries: 3
    delay: 100ms
    max-delay: 10s
    backoff-factor: 2.0
  schema-registry-url: http://schema-registry:8081
