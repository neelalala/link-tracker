telegram:
  resilience:
    timeout: 10s
    retry:
      enabled: true
      max-retries: 5
      delay: 100ms
      backoff: true
      backoff-factor: 3.0
      max-delay: 15s

logger:
  level: INFO

scrapper-service:
  protocol: grpc
  resilience:
    timeout: 10s
    retry:
      enabled: true
      max-retries: 5
      delay: 100ms
      backoff: true
      backoff-factor: 3.0
      max-delay: 15s

database:
  access-type: SQL

kafka:
  enabled: true
  brokers:
    - "kafka-1:9092"
    - "kafka-2:9092"
    - "kafka-3:9092"
  topic: link-updates
  dlq-topic: link-updates-dlq
  consumer-group: bot-group-1
  retries: 3
  schema-registry-url: http://schema-registry:8081
