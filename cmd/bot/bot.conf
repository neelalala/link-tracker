telegram = {
    token = ${TELEGRAM_TOKEN}
    api-url = "https://api.telegram.org/bot"
    api-url = ${?TELEGRAM_API_URL}
    timeout = 10 s
    timeout = ${?TELEGRAM_TIMEOUT}
}

logger = {
    level = INFO
    level = ${?BOT_LOG_LEVEL}
    file = ${?BOT_LOGS_FILE}
}

scrapper-service = {
    url = ${SCRAPPER_URL}
    protocol = "grpc"
    protocol = ${?SCRAPPER_API_PROTOCOL}
}

database = {
    url = ${DATABASE_URL}
    access-type = SQL
    access-type = ${?DATABASE_ACCESS_TYPE}
}

use-queue = ${?USE_QUEUE}
kafka = {
    brokers = ["kafka-1:9092", "kafka-2:9092", "kafka-3:9092"]
    brokers = ${?KAFKA_BROKERS}
    topic = "link-updates"
    topic = ${?KAFKA_TOPIC}
    dlq-topic = "link-updates-dlq"
    dlq-topic = ${?KAFKA_DLQ_TOPIC}
    consumer-group = "bot-group-1"
    consumer-group = ${?KAFKA_BOT_CONSUMER_GROUP}
    retries = {
        max-retries = 3
        max-retries = ${?KAFKA_MAX_RETRIES}
        delay = 150 ms
        delay = ${?KAFKA_RETRY_DELAY}
        max-delay = 30s
        max-delay = ${?KAFKA_RETRY_MAX_DELAY}
        backoff-factor = 2.0
        backoff-factor = ${?KAFKA_RETRY_BACKOFF_FACTOR}
    }
    schema-registry-url = "http://schema-registry:8081"
    schema-registry-url = ${?SCHEMA_REGISTRY_URL}
}

server = {
    protocol = ${?BOT_API_PROTOCOL}
    port = ${?BOT_API_PORT}
}