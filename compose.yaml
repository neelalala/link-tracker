services:
  bot:
    build:
      context: .
      dockerfile: cmd/bot/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - BOT_API_PORT=63342
      - SCRAPPER_URL=scrapper:63343
      - BOT_API_PROTOCOL=grpc
      - SCRAPPER_API_PROTOCOL=grpc
      - NO_PROXY=schema-registry,kafka-1,kafka-2,kafka-3,scrapper,postgres,localhost,127.0.0.1

  scrapper:
    build:
      context: .
      dockerfile: cmd/scrapper/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_started
      valkey-cluster-init:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_URL=bot:63342
      - SCRAPPER_API_PORT=63343
      - BOT_API_PROTOCOL=grpc
      - SCRAPPER_API_PROTOCOL=grpc
      - NO_PROXY=schema-registry,kafka-1,kafka-2,kafka-3,valkey-1,valkey-2,valkey-3,postgres,localhost,127.0.0.1

  postgres:
    image: postgres:17-alpine
    container_name: postgres_container
    env_file:
      - .env
    ports:
      - "5430:5432"
    volumes:
      - ./pgdata:${PGDATA}
    restart: unless-stopped
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  kafka-1:
    image: apache/kafka:latest
    container_name: kafka-1
    ports:
      - "9092:9092"
    env_file:
      - kafka_common.env
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9092

  kafka-2:
    image: apache/kafka:latest
    container_name: kafka-2
    ports:
      - "9094:9092"
    env_file:
      - kafka_common.env
    environment:
      - KAFKA_NODE_ID=2
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9092

  kafka-3:
    image: apache/kafka:latest
    container_name: kafka-3
    ports:
      - "9095:9092"
    env_file:
      - kafka_common.env
    environment:
      - KAFKA_NODE_ID=3
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-3:9092

  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    container_name: schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka-1:9092,PLAINTEXT://kafka-2:9092,PLAINTEXT://kafka-3:9092'
    depends_on:
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    command: >
      bash -c "
        echo 'Waiting for Kafka cluster to be ready...';
        sleep 10;
        ./opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic link-updates.raw --partitions 3 --replication-factor 3 --bootstrap-server kafka-1:9092
        ./opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic link-updates.processed --partitions 3 --replication-factor 3 --bootstrap-server kafka-1:9092
        ./opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic link-updates-dlq --partitions 3 --replication-factor 3 --bootstrap-server kafka-1:9092
        echo 'Topics created successfully!';
        "

  valkey-1:
    image: valkey/valkey:9-alpine
    container_name: valkey-1
    command: >
      valkey-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-hostname valkey-1
      --cluster-preferred-endpoint-type hostname
      --appendonly yes
      --bind 0.0.0.0
      --port 6379
    ports:
      - "7001:6379"
    volumes:
      - valkey-1-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "valkey-cli", "-h", "127.0.0.1", "-p", "6379", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 10

  valkey-2:
    image: valkey/valkey:9-alpine
    container_name: valkey-2
    command: >
      valkey-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-hostname valkey-2
      --cluster-preferred-endpoint-type hostname
      --appendonly yes
      --bind 0.0.0.0
      --port 6379
    ports:
      - "7002:6379"
    volumes:
      - valkey-2-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "valkey-cli", "-h", "127.0.0.1", "-p", "6379", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 10

  valkey-3:
    image: valkey/valkey:9-alpine
    container_name: valkey-3
    command: >
      valkey-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-hostname valkey-3
      --cluster-preferred-endpoint-type hostname
      --appendonly yes
      --bind 0.0.0.0
      --port 6379
    ports:
      - "7003:6379"
    volumes:
      - valkey-3-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "valkey-cli", "-h", "127.0.0.1", "-p", "6379", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 10

  valkey-cluster-init:
    image: valkey/valkey:9-alpine
    container_name: valkey-cluster-init
    depends_on:
      valkey-1:
        condition: service_healthy
      valkey-2:
        condition: service_healthy
      valkey-3:
        condition: service_healthy
    command: >
      sh -c "
        if valkey-cli -h valkey-1 -p 6379 cluster info | grep -q 'cluster_state:ok'; then
          echo 'Valkey cluster already initialized';
          exit 0;
        fi;
        echo 'Creating Valkey cluster...';
        valkey-cli --cluster create valkey-1:6379 valkey-2:6379 valkey-3:6379 --cluster-replicas 0 --cluster-yes;
        echo 'Valkey cluster created';
      "

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    depends_on:
      - valkey-cluster-init
    restart: unless-stopped
networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  valkey-1-data:
    driver: local
  valkey-2-data:
    driver: local
  valkey-3-data:
    driver: local
  redis-insight-data:
    driver: local
